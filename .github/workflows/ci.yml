name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          # action-setup auto-detects pnpm version from packageManager field if present,
          # otherwise from the root package.json engines.pnpm constraint. Falls back to
          # latest if neither is specified.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Note: pnpm-lock.yaml is gitignored so we cannot use --frozen-lockfile.
      # This workflow will always install against the latest resolutions allowed by package.json.
      - run: pnpm install

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
        # Docker-dependent tests (C4_DOCKER_TESTS env) are not enabled here.

name = "c4-registry"
main = "src/index.ts"
compatibility_date = "2024-09-19"
compatibility_flags = ["nodejs_compat"]
account_id = "61d185ff419ef7bd5bd4b3d314081a49"

[[d1_databases]]
binding = "DB"
database_name = "c4-registry"
database_id = "d2b2e6f9-c692-4937-9448-bdcb07b9ee6a"

[triggers]
crons = ["*/2 * * * *"]

# Single-Worker deployment on the custom domain, with Cloudflare Access in
# front of just the /admin path (Access application path: c4.devdogsuga.org/admin*).
# Everything else (/, /api/*, /health) stays publicly reachable from this
# same Worker — see MODE=both below.
[[routes]]
pattern = "c4.devdogsuga.org"
custom_domain = true

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   FORM_HMAC_SECRET   - shared secret with the Apps Script HMAC signer
#   ROSTER_TOKEN        - bearer token for GET /api/roster
#   RESULTS_TOKEN        - bearer token for POST /api/results (arena machine)
#   GITHUB_TOKEN        - GitHub REST API token (repo read scope) for cron refresh
#   DISCORD_WEBHOOK_URL - webhook URL for registration/results notifications
# Set them on BOTH `c4-registry` and `c4-registry-admin` if deploying the
# split (workers.dev) topology below; each is deployed independently.
#
# Vars (plain, can live here or be set with `wrangler secret put` too):
[vars]
# Comma-separated allowlist checked against the *verified* Access JWT email
# claim for /admin, in addition to Cloudflare Access itself gating the route
# at the edge. Leave unset ("") to allow any address Access has authenticated.
ADMIN_EMAILS = ""
# This deployment (c4.devdogsuga.org) serves every route, including /admin,
# from one Worker — Cloudflare Access gates just the /admin path at the edge
# (see [[routes]] and the Access application above).
MODE = "both"
#
# REQUIRED wherever admin routes are actually served (MODE=admin or
# MODE=both, i.e. here) — admin routes fail closed with 503 "admin not
# configured" until both are set, rather than trusting any header:
#
#   ACCESS_TEAM_DOMAIN - your Zero Trust team domain, e.g.
#                         "devdogs.cloudflareaccess.com". Zero Trust dash ->
#                         Settings -> Custom Pages shows it, or read it off
#                         the URL you're redirected to when logging in to
#                         any Access application for this team.
#   ACCESS_AUD          - the Access application's Audience (AUD) tag. Zero
#                         Trust dash -> Access -> Applications -> (the
#                         c4.devdogsuga.org/admin* app) -> Overview ->
#                         "Application Audience (AUD) Tag".
#
# Left blank here on purpose (not secret, but deployment-specific) — set at
# deploy time:
#   wrangler deploy --var ACCESS_TEAM_DOMAIN:devdogs.cloudflareaccess.com --var ACCESS_AUD:<aud-tag>
# ...or fill in the values below directly once known.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
#
# Alternative topology: on workers.dev, Access can only protect a whole
# hostname, not a path, so deploy this same script as two separate Workers
# instead:
#   wrangler deploy --var MODE:public          # -> c4-registry (this name)
#   wrangler deploy --env admin                # -> c4-registry-admin, below
# Put Cloudflare Access in front of the entire c4-registry-admin.workers.dev
# host; leave c4-registry.workers.dev public. (This also means dropping the
# [[routes]] custom-domain binding above, which only applies to this name.)

[env.admin]
name = "c4-registry-admin"
# Don't inherit the top-level [[routes]] custom-domain binding — env.admin
# is the workers.dev alternative topology and must never steal
# c4.devdogsuga.org away from the top-level (MODE=both) Worker.
routes = []

[env.admin.vars]
ADMIN_EMAILS = ""
MODE = "admin"
# REQUIRED (see the comment on ACCESS_TEAM_DOMAIN/ACCESS_AUD above) — the
# admin deployment 503s on every /admin route until these are set:
#   wrangler deploy --env admin --var ACCESS_TEAM_DOMAIN:devdogs.cloudflareaccess.com --var ACCESS_AUD:<aud-tag>
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[env.admin.d1_databases]]
binding = "DB"
database_name = "c4-registry"
database_id = "d2b2e6f9-c692-4937-9448-bdcb07b9ee6a"

# No [env.admin.triggers]: the admin-only deployment doesn't run the repo
# status cron (that belongs to the public/both deployment).
[env.admin.triggers]
crons = []
